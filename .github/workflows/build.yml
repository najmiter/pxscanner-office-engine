name: Build engine

on:
  workflow_dispatch:
    inputs:
      libreoffice_tag:
        description: LibreOffice core tag to build
        required: true
        default: libreoffice-26.8.2.2

permissions:
  contents: write

env:
  NDK_VERSION: 27.1.12297006
  LO_TAG: ${{ inputs.libreoffice_tag }}

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            distro: LibreOfficeAndroidAarch64
          - abi: armeabi-v7a
            distro: LibreOfficeAndroid
          - abi: x86_64
            distro: LibreOfficeAndroidX86_64
    env:
      CCACHE_DIR: /mnt/ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "true"
      TARBALLS: /mnt/lo-tarballs
      SRC: /mnt/lo/core
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /usr/local/julia* \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force
          sudo mkdir -p /mnt/lo "$CCACHE_DIR" "$TARBALLS"
          sudo chown -R "$USER" /mnt/lo "$CCACHE_DIR" "$TARBALLS"
          df -h / /mnt

      - name: Install build dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y libreoffice
          sudo apt-get install -y ccache git autoconf automake bison flex gperf libtool make nasm pkg-config \
            python3 python3-dev zip unzip xsltproc libxml2-utils

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name "$NDK_VERSION" -exec sudo rm -rf {} +
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: /mnt/ccache
          key: ccache-${{ matrix.abi }}-${{ env.LO_TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.abi }}-${{ env.LO_TAG }}-
            ccache-${{ matrix.abi }}-

      - name: Restore external tarballs
        uses: actions/cache@v4
        with:
          path: /mnt/lo-tarballs
          key: tarballs-${{ env.LO_TAG }}-${{ matrix.abi }}
          restore-keys: |
            tarballs-${{ env.LO_TAG }}-
            tarballs-

      - name: Check out LibreOffice
        run: git clone --depth 1 --branch "$LO_TAG" https://github.com/LibreOffice/core.git "$SRC"

      - name: Configure
        working-directory: /mnt/lo/core
        run: |
          cat > autogen.input <<EOF
          --with-distro=${{ matrix.distro }}
          --with-android-sdk=$ANDROID_HOME
          --with-android-ndk=$NDK_HOME
          --with-jdk-home=$JAVA_HOME_17_X64
          --with-external-tar=$TARBALLS
          --with-parallelism=$(nproc)
          EOF
          ./autogen.sh

      - name: Build
        working-directory: /mnt/lo/core
        run: |
          ccache --zero-stats
          make
          ccache --show-stats

      - name: Package
        working-directory: /mnt/lo/core
        run: |
          test -f "android/jniLibs/${{ matrix.abi }}/liblo-native-code.so"
          test -d android/source/assets
          test -d android/source/assets_strippedUI
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out/engine/jniLibs" "$out/engine/licenses"
          cp -r "android/jniLibs/${{ matrix.abi }}" "$out/engine/jniLibs/"
          cp -r android/source/assets "$out/engine/assets"
          cp -r android/source/assets_strippedUI "$out/engine/assets_strippedUI"
          find instdir -maxdepth 2 \( -iname 'LICENSE*' -o -iname 'NOTICE*' -o -iname 'CREDITS*' \) -type f \
            -exec cp {} "$out/engine/licenses/" \;
          printf 'libreoffice_tag=%s\nlibreoffice_commit=%s\nabi=%s\nndk=%s\n' \
            "$LO_TAG" "$(git rev-parse HEAD)" "${{ matrix.abi }}" "$NDK_VERSION" > "$out/engine/BUILD_INFO"
          tar -C "$out/engine" -czf "$out/pxscanner-office-engine-${{ matrix.abi }}.tar.gz" .
          ls -lh "$out"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.abi }}
          path: out/pxscanner-office-engine-${{ matrix.abi }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download engines
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package Java bindings
        run: |
          git clone --depth 1 --branch "$LO_TAG" --filter=blob:none --sparse https://github.com/LibreOffice/core.git lo
          git -C lo sparse-checkout set android/Bootstrap/src
          tar -C lo/android/Bootstrap -czf dist/pxscanner-office-bindings.tar.gz src

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "engine-$LO_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Engine $LO_TAG" \
            --notes "LibreOffice $LO_TAG built for Android with NDK $NDK_VERSION."
